<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- <input type="text" id="txtSample01" placeholder="num 01" /> -->
    <!-- <input type="text" id="txtSample02" placeholder="num 02" /> -->

     <!-- <div id="lblSection">0</div> -->

     <input type="text" name="display01" id="display01" readonly>
     <!-- <input type="text" name="display02" id="display02"> -->
     <br>

     <input type="button" value="%" onclick="presentageSymbol()" />
     <input type="button" value="CE" onclick="CE()" />
     <input type="button" value="C" onclick="clearSymbol()" />
     <input type="button" value="Erase" onclick="eraseSymbol()" />
     <br>
     
     <input type="button" value="7" onclick="number7()" />
     <input type="button" value="8" onclick="number8()" />
     <input type="button" value="9" onclick="number9()" />
     <input type="button" value="*" onclick="multipleSymbol()" />
     <br>
     <input type="button" value="4" onclick="number4()" />
     <input type="button" value="5" onclick="number5()" />
     <input type="button" value="6" onclick="number6()" />
     <input type="button" value="-" onclick="minusSymbol()" />
     <br>
     <input type="button" value="1" onclick="number1()" />
     <input type="button" value="2" onclick="number2()" />
     <input type="button" value="3" onclick="number3()" />
     <input type="button" value="+" onclick="plusSymbol()" />
     <br>
     <input type="button" value="." onclick="dotSymbol()" />
     <input type="button" value="0" onclick="number0()" />
     <input type="button" value="=" onclick="equalsSymbol()" />
     <input type="button" value="/" onclick="divideSymbol()" />
    
    

    <script src="app.js"></script>
  </body>
</html>
